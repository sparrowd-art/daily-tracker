<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Seu progresso diário, com simplicidade.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Daily Tracker</title>
<style>
:root{color-scheme:dark;--bg:#111;--panel:#1b1b1b;--panel2:#242424;--line:#303030;--text:#f2f2f2;--muted:#929292;--green:#9bc6aa;--green-dark:#203329}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:560px;margin:auto;padding:24px 18px 42px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{font-size:19px;font-weight:750;letter-spacing:-.6px}.dot{color:var(--green)}
.iconbtn,button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;padding:10px 13px;font:inherit}
h1{font-size:34px;line-height:1.1;letter-spacing:-1.3px;margin:4px 0 5px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
.sub{color:var(--muted);margin:0 0 22px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.stat,.section{background:var(--panel);border:1px solid #252525;border-radius:18px;padding:16px}
.stat strong{display:block;font-size:27px;letter-spacing:-1px}.stat span{color:var(--muted);font-size:12px}
.progress-head,.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress-head{font-size:12px;color:var(--muted);margin:22px 2px 9px}
.track{height:7px;border-radius:20px;background:#303030;overflow:hidden}.fill{height:100%;background:var(--green);width:0;transition:width .2s}
.section{margin-top:16px}.section h2{font-size:15px;margin:0;font-weight:700}.section-head{margin-bottom:14px}
.task-list{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:12px;background:#222}
.task input{appearance:none;width:20px;height:20px;border:1.5px solid #666;border-radius:6px;margin:0;flex:none;display:grid;place-items:center}
.task input:checked{background:var(--green);border-color:var(--green)}.task input:checked:after{content:"✓";color:#15251b;font-size:14px;font-weight:900}
.task label{flex:1;overflow-wrap:anywhere}.task.done label{color:#858585;text-decoration:line-through}
.remove{background:transparent;color:#777;padding:4px 7px;font-size:19px}
.addrow{display:flex;gap:8px;margin-top:12px}.addrow input{min-width:0;flex:1;background:#222;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font:inherit;outline:none}
.addrow input:focus{border-color:#777}.primary{background:var(--green);color:#17251c;font-weight:750;padding:0 16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dayname,.day{font-size:11px;text-align:center;color:var(--muted);padding:7px 0}
.day{border-radius:8px;background:#242424;color:#aaa;min-height:34px;display:grid;place-items:center}.day.complete{background:var(--green-dark);color:var(--green)}.day.today{outline:1px solid var(--green);color:#fff}
.monthnav{display:flex;align-items:center;gap:10px}.monthnav button{padding:5px 9px}
.footer{color:#666;text-align:center;font-size:11px;margin-top:24px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eee;color:#111;padding:9px 14px;border-radius:20px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(min-width:500px){main{padding-top:34px}}
</style>
</head>
<body>
<main>
<header><div class="brand">daily<span class="dot">.</span>tracker</div><button class="iconbtn" id="installBtn" hidden>Instalar</button></header>
<div class="eyebrow" id="todayLabel">SEU PROGRESSO</div>
<h1 id="greeting">Um dia de cada vez.</h1>
<p class="sub">Pequenas ações, todos os dias.</p>
<div class="stats">
 <div class="stat"><strong id="doneCount">0/0</strong><span>Tarefas de hoje</span></div>
 <div class="stat"><strong id="monthCount">0</strong><span>Dias completos no mês</span></div>
</div>
<div class="progress-head"><span>PROGRESSO DE HOJE</span><strong id="percent">0%</strong></div>
<div class="track"><div class="fill" id="progressFill"></div></div>
<section class="section">
 <div class="section-head"><h2>Foco de hoje</h2><span class="eyebrow" id="dateShort"></span></div>
 <div class="task-list" id="taskList"></div>
 <form class="addrow" id="addForm"><input id="newTask" maxlength="70" placeholder="Adicionar uma tarefa..." autocomplete="off"><button class="primary" type="submit">+</button></form>
</section>
<section class="section">
 <div class="section-head"><h2>Seu mês</h2><div class="monthnav"><button id="prevMonth" aria-label="Mês anterior">‹</button><strong id="monthTitle" style="font-size:12px"></strong><button id="nextMonth" aria-label="Próximo mês">›</button></div></div>
 <div class="days" id="calendar"></div>
</section>
<div class="footer">SEU RITMO. SUA EVOLUÇÃO.</div>
</main>
<div class="toast" id="toast"></div>
<script>
const KEY='daily-tracker-v1';
const defaultTasks=['Estudar inglês','Ler 10 páginas','Fazer exercícios','Desenvolvimento pessoal','Organizar o dia'];
let state=load();
let viewDate=new Date();
function localKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tasks)&&x.days)return x}catch(e){}return {tasks:defaultTasks.map((name,i)=>({id:String(i+1),name})),days:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function record(){const k=localKey();if(!state.days[k])state.days[k]={done:[]};return state.days[k]}
function completedDay(k){const r=state.days[k];return !!(r&&state.tasks.length&&state.tasks.every(t=>r.done.includes(t.id)))}
function render(){
 const now=new Date(),key=localKey(),r=record();
 document.getElementById('todayLabel').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
 document.getElementById('dateShort').textContent=now.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).toUpperCase();
 const count=state.tasks.filter(t=>r.done.includes(t.id)).length,pct=state.tasks.length?Math.round(count/state.tasks.length*100):0;
 document.getElementById('doneCount').textContent=`${count}/${state.tasks.length}`;
 document.getElementById('percent').textContent=pct+'%';
 document.getElementById('progressFill').style.width=pct+'%';
 const monthPrefix=key.slice(0,7);
 document.getElementById('monthCount').textContent=Object.keys(state.days).filter(k=>k.startsWith(monthPrefix)&&completedDay(k)).length;
 const list=document.getElementById('taskList');list.innerHTML='';
 if(!state.tasks.length){list.innerHTML='<p class="sub">Adicione sua primeira tarefa acima.</p>'}
 state.tasks.forEach(t=>{
  const row=document.createElement('div');row.className='task'+(r.done.includes(t.id)?' done':'');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=r.done.includes(t.id);cb.id='task-'+t.id;
  cb.addEventListener('change',()=>{const rr=record();rr.done=cb.checked?[...rr.done,t.id]:rr.done.filter(x=>x!==t.id);save();render()});
  const label=document.createElement('label');label.htmlFor=cb.id;label.textContent=t.name;
  const del=document.createElement('button');del.className='remove';del.type='button';del.textContent='×';del.setAttribute('aria-label','Excluir '+t.name);
  del.addEventListener('click',()=>{if(confirm(`Excluir "${t.name}" da sua lista?`)){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()}});
  row.append(cb,label,del);list.append(row);
 });
 renderCalendar();
}
function renderCalendar(){
 const y=viewDate.getFullYear(),m=viewDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
 document.getElementById('monthTitle').textContent=first.toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).toUpperCase();
 const cal=document.getElementById('calendar');cal.innerHTML='';
 ['D','S','T','Q','Q','S','S'].forEach(x=>{const e=document.createElement('div');e.className='dayname';e.textContent=x;cal.append(e)});
 for(let i=0;i<first.getDay();i++){const e=document.createElement('div');cal.append(e)}
 for(let n=1;n<=last.getDate();n++){const d=new Date(y,m,n),k=localKey(d),e=document.createElement('div');e.className='day'+(completedDay(k)?' complete':'')+(k===localKey()?' today':'');e.textContent=n;e.title=completedDay(k)?'Todas as tarefas concluídas':'';cal.append(e)}
}
document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('newTask'),name=input.value.trim();if(!name)return;state.tasks.push({id:Date.now().toString(36),name});save();input.value='';render();input.focus()});
document.getElementById('prevMonth').onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);renderCalendar()};
document.getElementById('nextMonth').onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);renderCalendar()};
let deferredPrompt;const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body></html>
